[project]
name = "c-parser"
version = "0.1.0"
description = "Extract undocumented C/C++ entities for LLM documentation generation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tree-sitter>=0.22",
    "tree-sitter-c>=0.23",
    "tree-sitter-cpp>=0.23",
    "python-dotenv>=1.0",
    "neo4j>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
c-parser = "c_parser.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/c_parser", "src/config"]

[tool.hatch.build.targets.sdist]
include = ["src/c_parser", "src/config", "tests", "README.md"]
[tool.pytest.ini_options]
testpaths = ["tests"]
